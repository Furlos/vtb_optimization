name: Benchmark safety checks
on:
  push:
    paths:
      - "main.py"
      - "tests/**"
      - ".github/workflows/safety.yml"
  pull_request:
    paths:
      - "main.py"
      - "tests/**"
      - ".github/workflows/safety.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install psycopg2-binary pytest
      - run: python -m py_compile main.py
      - run: python -m pytest -q
